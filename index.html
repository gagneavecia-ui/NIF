<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A1128">
  <meta name="description" content="N.I.F - Niger Investment & Finance">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #D4AF37;
      --primary-dark: #AA8417;
      --primary-light: #F3E5AB;
      --bg-dark: #0A1128;
      --text-light: #FFFFFF;
      --text-dim: #94A3B8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gradient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 60% 50% at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 85% 85%, rgba(16, 185, 129, 0.04) 0%, transparent 60%),
                  linear-gradient(180deg, #0A1128 0%, #070C1E 100%);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: orbFloat 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12), transparent 70%);
      top: -150px;
      left: -150px;
    }
    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.06), transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -20px) scale(1.05); }
      66% { transform: translate(-15px, 15px) scale(0.95); }
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== LOGO ===== */
    .logo-main {
      font-size: 80px;
      font-weight: 800;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      letter-spacing: 8px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      transform: skewX(-5deg);
      transition: transform 0.4s ease;
    }

    .logo-main:hover {
      transform: skewX(-8deg) scale(1.02);
    }

    .logo-main .dot {
  display: inline-block;
  font-size: 0.42em;
  color: var(--primary);
  -webkit-text-fill-color: var(--primary);
  vertical-align: middle;
  margin: 0 4px;
  transform: translateY(-6px);
}

    .logo-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 10px;
      font-weight: 300;
      opacity: 0.6;
      font-style: italic;
    }

    /* ===== DIVIDER (trait doré) ===== */
    .divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: 18px auto;
      border-radius: 2px;
    }

    /* ===== LOADER ===== */
    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .loader-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.2);
      animation: dotBounce 1.4s ease-in-out infinite both;
    }

    .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0s; }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
        background: var(--primary);
      }
    }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.25;
      letter-spacing: 1.5px;
      font-weight: 300;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .logo-main {
        font-size: 48px;
        letter-spacing: 4px;
      }
      .logo-main .dot {
        font-size: 0.6em;
      }
      .logo-subtitle {
        font-size: 10px;
        letter-spacing: 3px;
      }
      .splash-container {
        padding: 16px;
      }
      .divider {
        width: 35px;
        margin: 14px auto;
      }
      .loader-dots {
        gap: 8px;
        margin-top: 24px;
      }
    }

    @media (min-width: 768px) {
      .logo-main {
        font-size: 100px;
        letter-spacing: 10px;
      }
      .logo-subtitle {
        font-size: 15px;
        letter-spacing: 8px;
      }
    }

    @media (min-width: 1024px) {
      .logo-main {
        font-size: 120px;
        letter-spacing: 12px;
      }
      .splash-container {
        max-width: 600px;
      }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="splash-container">

  <!-- LOGO -->
  <div class="logo-main">
  N<span class="dot">·</span>I<span class="dot">·</span>F
</div>
  <div class="logo-subtitle">Niger Investment &amp; Finance</div>

  <!-- TRAIT DORÉ -->
  <div class="divider"></div>

  <!-- LOADER -->
  <div class="loader-dots">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

<div class="footer">
  &copy; 2026 N.I.F
</div>

</body>
</html>
