<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A1128">
  <meta name="description" content="N.I.F - Assistant IA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #D4AF37;
      --primary-dark: #AA8417;
      --primary-light: #F3E5AB;
      --bg-dark: #0A1128;
      --bg-surface: #111A36;
      --text-light: #FFFFFF;
      --text-dim: #94A3B8;
      --card-bg: rgba(17, 26, 54, 0.65);
      --card-border: rgba(212, 175, 55, 0.12);
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --glass-bg: rgba(212, 175, 55, 0.03);
      --glass-border: rgba(212, 175, 55, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      touch-action: pan-y;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse 60% 50% at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 85% 85%, rgba(16, 185, 129, 0.04) 0%, transparent 60%),
                  linear-gradient(180deg, #0A1128 0%, #070C1E 100%);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12), transparent 70%);
      top: -100px;
      left: -100px;
    }
    .orb-2 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.06), transparent 70%);
      bottom: 20%;
      right: -80px;
      animation-delay: -4s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -20px) scale(1.05); }
      66% { transform: translate(-15px, 15px) scale(0.95); }
    }

    /* ============================================================
       MENU LATÉRAL GAUCHE
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 290px;
      height: 100%;
      background: rgba(10, 17, 40, 0.98);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(212, 175, 55, 0.1);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      overflow-y: auto;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .sidebar .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--primary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      margin-bottom: 8px;
      width: 100%;
    }

    .sidebar .new-chat-btn:active { transform: scale(0.96); }
    .sidebar .new-chat-btn:hover { background: rgba(212, 175, 55, 0.2); }
    .sidebar .new-chat-btn i { font-size: 16px; }

    .sidebar .search-toggle-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      width: 100%;
      margin-bottom: 8px;
    }

    .sidebar .search-toggle-btn:active { transform: scale(0.96); }
    .sidebar .search-toggle-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
    .sidebar .search-toggle-btn i { color: var(--primary); font-size: 15px; }

    .sidebar .search-area {
      display: none;
      margin-bottom: 12px;
    }

    .sidebar .search-area.show { display: block; }

    .sidebar .search-area input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 17, 40, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: var(--transition);
    }

    .sidebar .search-area input:focus { border-color: var(--primary); }

    .sidebar .history-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      opacity: 0.5;
      margin-top: 8px;
    }

    .sidebar .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar .chat-list::-webkit-scrollbar { width: 2px; }
    .sidebar .chat-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar .chat-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .sidebar .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
      text-decoration: none;
    }

    .sidebar .chat-item:active { transform: scale(0.96); }
    .sidebar .chat-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
    .sidebar .chat-item.active { background: rgba(212, 175, 55, 0.08); color: var(--primary); }

    .sidebar .chat-item i { font-size: 14px; color: var(--primary); }
    .sidebar .chat-item .chat-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar .chat-item .chat-delete {
      color: var(--text-dim);
      opacity: 0.3;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition);
    }
    .sidebar .chat-item .chat-delete:hover { opacity: 1; color: var(--danger); }

    .sidebar .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid rgba(212, 175, 55, 0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      transition: var(--transition);
      cursor: pointer;
    }

    .sidebar .sidebar-footer a:active { transform: scale(0.96); }
    .sidebar .sidebar-footer a:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
    .sidebar .sidebar-footer a i { font-size: 16px; color: var(--primary); }

    /* ============================================================
       OVERLAY
       ============================================================ */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 3, 5, 0.5);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .ia-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(10, 17, 40, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.08);
    }

    .ia-header .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .ia-header .header-center {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      color: var(--text-light);
    }

    .ia-header .header-center span { color: var(--primary); }

    .ia-header .header-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .ia-header .header-right .user-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ia-header .menu-toggle {
      width: 36px;
      height: 36px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      transition: var(--transition);
      font-size: 18px;
    }

    .ia-header .menu-toggle:active { transform: scale(0.92); }
    .ia-header .menu-toggle:hover { border-color: rgba(212, 175, 55, 0.3); }

    /* ============================================================
       CONTENU PRINCIPAL
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
      position: relative;
    }

    /* ============================================================
       CHAT
       ============================================================ */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 70px;
      padding-bottom: 47px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      height: 100vh;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 8px 20px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      animation: messageIn 0.3s ease-out;
      word-wrap: break-word;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #0A1128;
      border-bottom-right-radius: 4px;
    }

    .message.ia {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-bottom-left-radius: 4px;
      color: var(--text-light);
    }

    .message .msg-time {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 6px;
      display: block;
      opacity: 0.5;
    }

    .message.user .msg-time { color: rgba(10, 17, 40, 0.5); }

    .message .msg-strong {
      font-weight: 700;
      color: var(--primary);
    }

    .message.ia .msg-strong { color: var(--primary-light); }

    .typing-indicator {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-radius: 16px;
      padding: 12px 16px;
      display: none;
      gap: 4px;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator.show { display: flex; }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: typingDot 1.4s ease-in-out infinite both;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0s; }

    @keyframes typingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       SUGGESTIONS
       ============================================================ */
    .suggestions {
      padding: 8px 4px 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-wrap: nowrap;
      scrollbar-width: none;
      justify-content: center;
      flex-shrink: 0;
    }

    .suggestions::-webkit-scrollbar { display: none; }

    .suggestion-btn {
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }

    .suggestion-btn:active { transform: scale(0.95); }
    .suggestion-btn:hover {
      border-color: var(--primary);
      color: var(--text-light);
      background: rgba(212, 175, 55, 0.05);
    }

    /* ============================================================
       INPUT (fixe en bas)
       ============================================================ */
    .chat-input-wrapper {
      flex-shrink: 0;
      padding: 0 4px 8px;
      background: transparent;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10, 17, 40, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 16px;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      align-items: center;
    }

    .chat-input-area:focus-within {
      border-color: var(--primary);
      background: rgba(10, 17, 40, 0.95);
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      min-width: 0;
    }

    .chat-input-area input::placeholder {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .chat-input-area .btn-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-input-area .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 17px;
      flex-shrink: 0;
    }

    .chat-input-area .btn-icon:active { transform: scale(0.92); }
    .chat-input-area .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-input-area .send-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #0A1128;
    }

    .chat-input-area .mic-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      color: var(--text-dim);
    }

    .chat-input-area .mic-btn:hover {
      border-color: rgba(212, 175, 55, 0.4);
      color: var(--text-light);
    }

    .chat-input-area .mic-btn.listening {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ============================================================
       TOAST (notification)
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 400px;
      width: 90%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 999;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast.success {
      background: #0D2A1F;
      border: 1px solid var(--success);
      color: var(--success);
    }

    .toast.error {
      background: #2A0D0D;
      border: 1px solid #EF4444;
      color: #EF4444;
    }

    .toast.info {
      background: #1A1A2E;
      border: 1px solid var(--primary);
      color: var(--primary-light);
    }

    /* ============================================================
       SWIPE AREA
       ============================================================ */
    .swipe-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 25px;
      height: 100%;
      z-index: 50;
      cursor: pointer;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .sidebar { width: 260px; }
      .message { max-width: 94%; font-size: 13px; }
      .suggestion-btn { font-size: 10px; padding: 5px 12px; }
      .chat-input-area { padding: 6px 10px; }
      .chat-input-area input { font-size: 13px; padding: 8px 4px; }
      .chat-input-area .btn-icon { width: 38px; height: 38px; font-size: 15px; }
      .ia-header .header-center { font-size: 15px; }
      .ia-header .header-right .user-name { font-size: 11px; max-width: 60px; }
      .main-content { padding: 0 12px; }
      .chat-container { padding-top: 65px; }
      .chat-messages { padding: 12px 4px 16px; }
    }

    @media (min-width: 768px) {
      .main-content { padding: 0 24px; }
      .chat-container { padding-top: 75px; }
      .message { max-width: 75%; }
      .chat-input-area { padding: 10px 16px; }
    }

    @media (pointer: fine) {
      .swipe-area { display: none; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     SWIPE AREA
     ============================================================ -->
<div class="swipe-area" id="swipeArea"></div>

<!-- ============================================================
     OVERLAY
     ============================================================ -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ============================================================
     MENU LATÉRAL
     ============================================================ -->
<div class="sidebar" id="sidebar">
  <button class="new-chat-btn" id="newChatBtn">
    <i class="fas fa-plus"></i> Nouvelle discussion
  </button>

  <button class="search-toggle-btn" id="searchToggleBtn">
    <i class="fas fa-search"></i> Rechercher une discussion
  </button>

  <div class="search-area" id="searchArea">
    <input type="text" id="searchInput" placeholder="Rechercher par nom...">
  </div>

  <div class="history-title">📋 Discussions</div>
  <div class="chat-list" id="chatList">
    <div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
      <i class="fas fa-spinner fa-spin" style="display:block; margin-bottom:8px; font-size:20px;"></i>
      Chargement...
    </div>
  </div>

  <div class="sidebar-footer">
    <a href="index.html"><i class="fas fa-home"></i> Accueil</a>
    <a href="boutique.html"><i class="fas fa-shopping-bag"></i> Boutique</a>
  </div>
</div>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="ia-header">
  <div class="header-left">
    <button class="menu-toggle" id="menuToggle">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <div class="header-center">
    N.I.<span>F</span>
  </div>

  <div class="header-right">
    <span class="user-name" id="headerUserName">Chargement...</span>
  </div>
</header>

<!-- ============================================================
     CHAT PRINCIPAL
     ============================================================ -->
<div class="main-content">

  <div class="chat-container">

    <div class="chat-messages" id="chatMessages">
      <div class="message ia">
        👋 Bonjour ! Je suis <strong class="msg-strong">NIF AI</strong>, l'assistant intelligent de NIF.<br><br>
        Je t'aide à apprendre, créer des projets et développer un business en ligne.<br><br>
        <span style="color: var(--text-dim); font-size: 13px;">
          Comment puis-je t'aider aujourd'hui ?
        </span>
        <span class="msg-time">Maintenant</span>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" data-question="Bonjour">👋 Bonjour</button>
      <button class="suggestion-btn" data-question="Qui es-tu ?">🤖 Qui es-tu ?</button>
      <button class="suggestion-btn" data-question="Je veux apprendre le développement web">💻 Développement web</button>
      <button class="suggestion-btn" data-question="Je veux créer un business en ligne">🚀 Business en ligne</button>
      <button class="suggestion-btn" data-question="Je veux utiliser l'IA">🤖 Utiliser l'IA</button>
      <button class="suggestion-btn" data-question="Je ne sais pas quoi apprendre">🤔 Conseils</button>
    </div>

    <div class="chat-input-wrapper">
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Écrivez votre message..." autocomplete="off">
        <div class="btn-group">
          <button class="btn-icon mic-btn" id="micBtn" title="Note vocale">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="btn-icon send-btn" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- IMPORTS -->
<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut 
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    doc, 
    getDoc, 
    setDoc, 
    updateDoc, 
    deleteDoc, 
    query, 
    where, 
    onSnapshot 
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEjj2oAg7ZL8HvdkSWliShxydgq_BPxzs",
    authDomain: "brickshare-d35b3.firebaseapp.com",
    projectId: "brickshare-d35b3",
    storageBucket: "brickshare-d35b3.firebasestorage.app",
    messagingSenderId: "613227362818",
    appId: "1:613227362818:web:c4de1ad3372c16d8d3051b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ===== PERSISTANCE - CRUCIAL POUR ÉVITER LES DÉCONNEXIONS =====
  setPersistence(auth, browserLocalPersistence);

  // ============================================================
  // DOM
  // ============================================================
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const menuToggle = document.getElementById('menuToggle');
  const swipeArea = document.getElementById('swipeArea');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const typingIndicator = document.getElementById('typingIndicator');
  const chatList = document.getElementById('chatList');
  const newChatBtn = document.getElementById('newChatBtn');
  const searchToggleBtn = document.getElementById('searchToggleBtn');
  const searchArea = document.getElementById('searchArea');
  const searchInput = document.getElementById('searchInput');
  const toast = document.getElementById('toast');
  const headerUserName = document.getElementById('headerUserName');

  let currentUser = null;
  let currentChatId = null;
  let allChats = [];
  let touchStartX = 0;
  let isMobile = window.innerWidth < 768;
  let knowledgeBase = {};
  let toastTimeout = null;
  let recognition = null;
  let isListening = false;
  let authTimeout = null; // Pour gérer le délai de redirection

  // ============================================================
  // RECONNAISSANCE VOCALE
  // ============================================================
  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      micBtn.style.display = 'none';
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      micBtn.innerHTML = '<i class="fas fa-circle" style="color: #EF4444;"></i>';
    };

    recognition.onerror = (event) => {
      console.error('Erreur reconnaissance:', event.error);
      stopListening();
      showToast('❌ Erreur microphone. Réessayez.', 'error');
    };

    recognition.onend = () => {
      stopListening();
    };

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      chatInput.value = transcript.trim();
    };
  }

  function startListening() {
    if (!recognition) {
      showToast('❌ La reconnaissance vocale n\'est pas supportée par votre navigateur.', 'error');
      return;
    }

    if (isListening) {
      stopListening();
      return;
    }

    try {
      recognition.start();
    } catch (error) {
      console.error('Erreur démarrage:', error);
    }
  }

  function stopListening() {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
    try {
      recognition.stop();
    } catch (error) {
      // Ignorer
    }
  }

  micBtn.addEventListener('click', startListening);

  // ============================================================
  // CHARGER LA BASE DE CONNAISSANCES DEPUIS FIRESTORE
  // ============================================================
  function loadKnowledge() {
    const knowledgeRef = collection(db, 'ia_knowledge');
    onSnapshot(knowledgeRef, (snapshot) => {
      knowledgeBase = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        knowledgeBase[data.key] = data.response;
      });
      console.log('✅ Base de connaissances chargée:', Object.keys(knowledgeBase).length, 'entrées');
    }, (error) => {
      console.error('❌ Erreur chargement connaissances:', error);
    });
  }

  // ============================================================
  // RECHERCHER RÉPONSE
  // ============================================================
  function getResponse(text) {
    const lower = text.toLowerCase().trim();
    
    for (const [key, value] of Object.entries(knowledgeBase)) {
      if (lower.includes(key) || key.includes(lower)) {
        return value;
      }
    }
    
    return "🤔 Je n'ai pas encore de réponse pour cela. Je suis en phase d'apprentissage. Tu peux poser une autre question ou utiliser les suggestions ci-dessous.";
  }

  // ============================================================
  // GESTION DES DISCUSSIONS (FIRESTORE + LOCAL)
  // ============================================================
  function getChatsCache() {
    return JSON.parse(localStorage.getItem(`nif_chats_${currentUser?.uid}`) || '[]');
  }

  function saveChatsCache(chats) {
    localStorage.setItem(`nif_chats_${currentUser?.uid}`, JSON.stringify(chats));
  }

  function listenChats() {
    if (!currentUser) return;

    const chatsRef = collection(db, 'ia_chats');
    const q = query(chatsRef, where('userId', '==', currentUser.uid));

    onSnapshot(q, (snapshot) => {
      const chats = [];
      snapshot.forEach(doc => {
        chats.push({ id: doc.id, ...doc.data() });
      });
      chats.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      allChats = chats;
      saveChatsCache(chats);
      renderChatList();
    }, (error) => {
      console.error('❌ Erreur écoute discussions:', error);
      const cached = getChatsCache();
      if (cached.length > 0) {
        allChats = cached;
        renderChatList();
      }
    });
  }

  function renderChatList() {
    if (allChats.length === 0) {
      chatList.innerHTML = `
        <div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
          <i class="fas fa-comment" style="display:block; margin-bottom:8px; font-size:20px;"></i>
          Aucune discussion
        </div>
      `;
      return;
    }

    let html = '';
    allChats.forEach(chat => {
      const isActive = chat.id === currentChatId ? 'active' : '';
      const name = chat.name || 'Nouvelle discussion';
      html += `
        <div class="chat-item ${isActive}" data-chatid="${chat.id}">
          <i class="fas fa-comment"></i>
          <span class="chat-name">${name}</span>
          <span class="chat-delete" data-chatid="${chat.id}"><i class="fas fa-times"></i></span>
        </div>
      `;
    });
    chatList.innerHTML = html;

    chatList.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.chat-delete')) return;
        const chatId = item.dataset.chatid;
        loadChat(chatId);
        closeMenu();
      });
    });

    chatList.querySelectorAll('.chat-delete').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const chatId = btn.dataset.chatid;
        if (confirm('Supprimer cette discussion ?')) {
          try {
            await deleteDoc(doc(db, 'ia_chats', chatId));
            showToast('Discussion supprimée', 'info');
            if (currentChatId === chatId) {
              currentChatId = null;
              chatMessages.innerHTML = `
                <div class="message ia">
                  👋 Bonjour ! Je suis <strong class="msg-strong">NIF AI</strong>.<br><br>
                  Comment puis-je t'aider aujourd'hui ?
                  <span class="msg-time">Maintenant</span>
                </div>
              `;
            }
          } catch (error) {
            console.error('Erreur suppression:', error);
            showToast('Erreur lors de la suppression', 'error');
          }
        }
      });
    });
  }

  async function createNewChat() {
    if (!currentUser) return;

    try {
      const chatId = 'chat_' + Date.now();
      const newChat = {
        userId: currentUser.uid,
        chatId: chatId,
        name: 'Nouvelle discussion',
        messages: [{
          sender: 'ia',
          text: '👋 Bonjour ! Je suis **NIF AI**, l\'assistant intelligent de NIF.\n\nComment puis-je t\'aider aujourd\'hui ?',
          time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
        }],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      await setDoc(doc(db, 'ia_chats', chatId), newChat);
      currentChatId = chatId;
      loadChat(chatId);
      closeMenu();
      showToast('Nouvelle discussion créée', 'info');
    } catch (error) {
      console.error('Erreur création:', error);
      showToast('Erreur lors de la création', 'error');
    }
  }

  async function loadChat(chatId) {
    try {
      const chatRef = doc(db, 'ia_chats', chatId);
      const chatSnap = await getDoc(chatRef);
      if (chatSnap.exists()) {
        const chat = chatSnap.data();
        currentChatId = chatId;
        chatMessages.innerHTML = '';
        chat.messages.forEach(msg => {
          addMessage(msg.text, msg.sender, msg.time);
        });
        renderChatList();
      }
    } catch (error) {
      console.error('Erreur chargement:', error);
    }
  }

  // ============================================================
  // AJOUTER UN MESSAGE
  // ============================================================
  function addMessage(text, sender, time) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const formattedText = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong class="msg-strong">$1</strong>');
    div.innerHTML = `${formattedText}<span class="msg-time">${time || 'Maintenant'}</span>`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // ============================================================
  // ENVOYER UN MESSAGE (SAUVEGARDE DANS FIRESTORE)
  // ============================================================
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || !currentUser) return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    if (!currentChatId) {
      const chatId = 'chat_' + Date.now();
      const newChat = {
        userId: currentUser.uid,
        chatId: chatId,
        name: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
        messages: [],
        createdAt: now.toISOString(),
        updatedAt: now.toISOString()
      };
      await setDoc(doc(db, 'ia_chats', chatId), newChat);
      currentChatId = chatId;
    }

    addMessage(text, 'user', timeStr);
    chatInput.value = '';
    sendBtn.disabled = true;

    const chatRef = doc(db, 'ia_chats', currentChatId);
    const chatSnap = await getDoc(chatRef);
    if (chatSnap.exists()) {
      const chat = chatSnap.data();
      const messages = [...chat.messages, { sender: 'user', text, time: timeStr }];
      const name = messages.length === 1 ? text.substring(0, 30) + (text.length > 30 ? '...' : '') : chat.name;
      await updateDoc(chatRef, { messages, name, updatedAt: new Date().toISOString() });
    }

    typingIndicator.classList.add('show');
    chatMessages.scrollTop = chatMessages.scrollHeight;

    setTimeout(async () => {
      typingIndicator.classList.remove('show');
      const response = getResponse(text);
      const responseTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      addMessage(response, 'ia', responseTime);

      const chatRef2 = doc(db, 'ia_chats', currentChatId);
      const chatSnap2 = await getDoc(chatRef2);
      if (chatSnap2.exists()) {
        const chat = chatSnap2.data();
        const messages = [...chat.messages, { sender: 'ia', text: response, time: responseTime }];
        await updateDoc(chatRef2, { messages, updatedAt: new Date().toISOString() });
      }

      sendBtn.disabled = false;
      chatMessages.scrollTop = chatMessages.scrollHeight;
      renderChatList();
    }, 800 + Math.random() * 400);
  }

  // ============================================================
  // GESTION DU MENU
  // ============================================================
  function openMenu() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('show');
    document.body.style.overflow = '';
  }

  menuToggle.addEventListener('click', openMenu);
  sidebarOverlay.addEventListener('click', closeMenu);

  if (isMobile) {
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });

    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchEndX - touchStartX > 60 && touchStartX < 40) {
        openMenu();
      }
    });
  }

  // ============================================================
  // RECHERCHE
  // ============================================================
  searchToggleBtn.addEventListener('click', () => {
    searchArea.classList.toggle('show');
    if (searchArea.classList.contains('show')) searchInput.focus();
  });

  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase();
    document.querySelectorAll('.chat-item').forEach(item => {
      const name = item.querySelector('.chat-name')?.textContent?.toLowerCase() || '';
      item.style.display = name.includes(query) ? 'flex' : 'none';
    });
  });

  // ============================================================
  // SUGGESTIONS
  // ============================================================
  document.querySelectorAll('.suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      chatInput.value = btn.dataset.question;
      sendMessage();
    });
  });

  // ============================================================
  // TOAST (notification)
  // ============================================================
  function showToast(message, type = 'info') {
    if (toastTimeout) {
      clearTimeout(toastTimeout);
      toastTimeout = null;
    }
    
    toast.classList.remove('show');
    void toast.offsetWidth;
    
    toast.textContent = message;
    toast.className = `toast ${type}`;
    
    toast.classList.add('show');
    
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
      toastTimeout = null;
    }, 3000);
  }

  // ============================================================
  // METTRE À JOUR LE HEADER AVEC LE NOM
  // ============================================================
  function updateHeader(userData) {
    if (!userData) return;
    const displayName = userData.prenom || userData.fullName || userData.nom || 'Invité';
    headerUserName.textContent = displayName;
  }

  // ============================================================
  // AUTH - VERSION CORRIGÉE AVEC DÉLAI DE 6 SECONDES
  // ============================================================
  onAuthStateChanged(auth, async (user) => {
    // Nettoyer le timeout précédent
    clearTimeout(authTimeout);

    if (user) {
      // ✅ Utilisateur connecté
      currentUser = user;
      localStorage.setItem('NIF_current_user', user.uid);
      
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) {
        const data = userSnap.data();
        updateHeader(data);
      }
      
      loadKnowledge();
      listenChats();
      
      const cached = getChatsCache();
      if (cached.length > 0) {
        loadChat(cached[0].id);
      }
      
    } else {
      // ❌ Utilisateur déconnecté
      const savedUid = localStorage.getItem('NIF_current_user');
      
      if (savedUid) {
        // On a une session sauvegardée, on attend 6 secondes pour laisser le temps au rafraîchissement
        authTimeout = setTimeout(() => {
          if (!auth.currentUser) {
            // Le token n'a pas pu être rafraîchi → redirection vers login
            console.log('⏳ Délai écoulé, redirection vers login...');
            localStorage.removeItem('NIF_current_user');
            window.location.href = 'login.html';
          }
        }, 6000); // Délai porté à 6 secondes
      } else {
        // Pas de session sauvegardée → redirection immédiate
        window.location.href = 'login.html';
      }
    }
  });

  // ============================================================
  // ÉVÉNEMENTS
  // ============================================================
  // Envoyer avec Entrée
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Envoyer avec le bouton
  sendBtn.addEventListener('click', sendMessage);

  // Nouvelle discussion
  newChatBtn.addEventListener('click', createNewChat);

  // Initialiser la reconnaissance vocale
  initSpeechRecognition();

  console.log('🚀 NIF IA chargée avec succès - Gestion de session améliorée !');
  console.log('🎙️ Note vocale disponible !');
</script>

</body>
</html>
