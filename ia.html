<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A1128">
  <meta name="description" content="N.I.F - Assistant IA">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
 :root {
  --primary: #D4AF37;
  --primary-dark: #AA8417;
  --primary-light: #F3E5AB;
  --bg-dark: #0A1128;
  --bg-surface: #111A36;
  --text-light: #FFFFFF;
  --text-dim: #94A3B8;
  --card-bg: rgba(17, 26, 54, 0.65);
  --card-border: rgba(212, 175, 55, 0.12);
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  --glass-bg: rgba(212, 175, 55, 0.03);
  --glass-border: rgba(212, 175, 55, 0.08);
  --sidebar-width: 300px;
  --header-height: 60px;
  --max-content-width: 1000px;
  --border-radius-sm: 8px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  --border-radius-xl: 20px;
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 20px;
  --spacing-xxl: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  touch-action: pan-y;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   BACKGROUND - FOND SOMBRE AVEC REFLETS DORÉS
   ============================================================ */
.gradient-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  background: radial-gradient(ellipse 60% 50% at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
              radial-gradient(ellipse 50% 40% at 85% 85%, rgba(16, 185, 129, 0.04) 0%, transparent 60%),
              linear-gradient(180deg, #0A1128 0%, #070C1E 100%);
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: -1;
  pointer-events: none;
  animation: orbFloat 8s ease-in-out infinite;
}
.orb-1 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.12), transparent 70%);
  top: -100px;
  left: -100px;
}
.orb-2 {
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.06), transparent 70%);
  bottom: 20%;
  right: -80px;
  animation-delay: -4s;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(20px, -20px) scale(1.05); }
  66% { transform: translate(-15px, 15px) scale(0.95); }
}

/* ============================================================
   SIDEBAR - MENU LATÉRAL
   ============================================================ */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-width);
  max-width: 85vw;
  height: 100%;
  background: rgba(10, 17, 40, 0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid rgba(212, 175, 55, 0.1);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  padding: var(--spacing-md) var(--spacing-md);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sidebar.open { transform: translateX(0); }

.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

.sidebar .new-chat-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: var(--border-radius-md);
  color: var(--primary);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
  margin-bottom: var(--spacing-sm);
  width: 100%;
  min-height: 48px;
}

.sidebar .new-chat-btn:active { transform: scale(0.96); }
.sidebar .new-chat-btn:hover { background: rgba(212, 175, 55, 0.2); }
.sidebar .new-chat-btn i { font-size: 16px; }

.sidebar .search-toggle-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--border-radius-md);
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
  width: 100%;
  margin-bottom: var(--spacing-sm);
  min-height: 44px;
}

.sidebar .search-toggle-btn:active { transform: scale(0.96); }
.sidebar .search-toggle-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
.sidebar .search-toggle-btn i { color: var(--primary); font-size: 15px; }

.sidebar .search-area {
  display: none;
  margin-bottom: var(--spacing-md);
}

.sidebar .search-area.show { display: block; }

.sidebar .search-area input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(10, 17, 40, 0.8);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: var(--border-radius-md);
  color: var(--text-light);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: var(--transition);
}

.sidebar .search-area input:focus { border-color: var(--primary); }
.sidebar .search-area input::placeholder { color: var(--text-dim); opacity: 0.6; }

.sidebar .history-title {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: var(--spacing-md);
  opacity: 0.5;
  margin-top: var(--spacing-sm);
}

.sidebar .chat-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs);
  overscroll-behavior: contain;
}

.sidebar .chat-list::-webkit-scrollbar { width: 2px; }
.sidebar .chat-list::-webkit-scrollbar-track { background: transparent; }
.sidebar .chat-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

.sidebar .chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px;
  border-radius: var(--border-radius-sm);
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
  text-decoration: none;
  min-height: 44px;
}

.sidebar .chat-item:active { transform: scale(0.96); }
.sidebar .chat-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
.sidebar .chat-item.active { background: rgba(212, 175, 55, 0.08); color: var(--primary); }

.sidebar .chat-item i { font-size: 14px; color: var(--primary); flex-shrink: 0; }
.sidebar .chat-item .chat-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar .chat-item .chat-delete {
  color: var(--text-dim);
  opacity: 0.3;
  cursor: pointer;
  font-size: 12px;
  transition: var(--transition);
  padding: 4px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sidebar .chat-item .chat-delete:hover { opacity: 1; color: var(--danger); }
.sidebar .chat-item .chat-delete:active { transform: scale(0.9); }

.sidebar .sidebar-footer {
  padding-top: var(--spacing-md);
  border-top: 1px solid rgba(212, 175, 55, 0.06);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs);
}

.sidebar .sidebar-footer a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px;
  border-radius: var(--border-radius-sm);
  color: var(--text-dim);
  text-decoration: none;
  font-size: 14px;
  transition: var(--transition);
  cursor: pointer;
  min-height: 44px;
}

.sidebar .sidebar-footer a:active { transform: scale(0.96); }
.sidebar .sidebar-footer a:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
.sidebar .sidebar-footer a i { font-size: 16px; color: var(--primary); }

/* ============================================================
   OVERLAY
   ============================================================ */
.sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(3, 3, 5, 0.5);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.sidebar-overlay.show {
  opacity: 1;
  visibility: visible;
}

/* ============================================================
   HEADER
   ============================================================ */
.ia-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px var(--spacing-lg);
  height: var(--header-height);
  background: rgba(10, 17, 40, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212, 175, 55, 0.08);
}

.ia-header .header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
}

.ia-header .header-center {
  flex: 1;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
  letter-spacing: 2px;
  color: var(--text-light);
  white-space: nowrap;
}

.ia-header .header-center span { color: var(--primary); }

.ia-header .header-right {
  flex: 0 0 auto;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.ia-header .header-right .user-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ia-header .menu-toggle {
  width: 40px;
  height: 40px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--border-radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  font-size: 18px;
  min-width: 40px;
}

.ia-header .menu-toggle:active { transform: scale(0.92); }
.ia-header .menu-toggle:hover { border-color: rgba(212, 175, 55, 0.3); }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: var(--max-content-width);
  margin: 0 auto;
  width: 100%;
  padding: 0 var(--spacing-lg);
  position: relative;
}

/* ============================================================
   CHAT
   ============================================================ */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-top: calc(var(--header-height) + var(--spacing-md));
  padding-bottom: var(--spacing-md);
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  height: 100vh;
  overflow: hidden;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
  padding: var(--spacing-lg) var(--spacing-sm) var(--spacing-xl);
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}

.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

.message {
  max-width: 88%;
  padding: 14px 18px;
  border-radius: var(--border-radius-lg);
  font-size: 15px;
  line-height: 1.6;
  animation: messageIn 0.3s ease-out;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

@keyframes messageIn {
  from { opacity: 0; transform: translateY(10px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #0A1128;
  border-bottom-right-radius: var(--spacing-xs);
}

.message.ia {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(212, 175, 55, 0.12);
  border-bottom-left-radius: var(--spacing-xs);
  color: var(--text-light);
}

.message .msg-time {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 8px;
  display: block;
  opacity: 0.5;
}

.message.user .msg-time { color: rgba(10, 17, 40, 0.5); }

.message .msg-strong {
  font-weight: 700;
  color: var(--primary);
}

.message.ia .msg-strong { color: var(--primary-light); }

/* ============================================================
   TYPING INDICATOR
   ============================================================ */
.typing-indicator {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(212, 175, 55, 0.12);
  border-radius: var(--border-radius-lg);
  padding: 14px 18px;
  display: none;
  gap: 4px;
  border-bottom-left-radius: var(--spacing-xs);
}

.typing-indicator.show { display: flex; }

.typing-indicator span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  animation: typingDot 1.4s ease-in-out infinite both;
}

.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
.typing-indicator span:nth-child(3) { animation-delay: 0s; }

@keyframes typingDot {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* ============================================================
   SUGGESTIONS
   ============================================================ */
.suggestions {
  padding: var(--spacing-sm) var(--spacing-xs) var(--spacing-md);
  display: flex;
  gap: var(--spacing-sm);
  overflow-x: auto;
  flex-wrap: nowrap;
  scrollbar-width: none;
  justify-content: flex-start;
  flex-shrink: 0;
  -webkit-overflow-scrolling: touch;
}

.suggestions::-webkit-scrollbar { display: none; }

.suggestion-btn {
  padding: 8px 16px;
  border-radius: 30px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
  flex-shrink: 0;
  min-height: 36px;
  touch-action: manipulation;
}

.suggestion-btn:active { transform: scale(0.95); }
.suggestion-btn:hover {
  border-color: var(--primary);
  color: var(--text-light);
  background: rgba(212, 175, 55, 0.05);
}

/* ============================================================
   INPUT - fixe en bas
   ============================================================ */
.chat-input-wrapper {
  flex-shrink: 0;
  padding: 0 var(--spacing-xs) var(--spacing-sm);
  background: transparent;
}

.chat-input-area {
  display: flex;
  gap: var(--spacing-sm);
  padding: 8px 12px;
  background: rgba(10, 17, 40, 0.8);
  border: 1px solid rgba(212, 175, 55, 0.15);
  border-radius: var(--border-radius-lg);
  transition: var(--transition);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  align-items: center;
}

.chat-input-area:focus-within {
  border-color: var(--primary);
  background: rgba(10, 17, 40, 0.95);
}

.chat-input-area input {
  flex: 1;
  padding: 10px 4px;
  background: transparent;
  border: none;
  color: var(--text-light);
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  outline: none;
  min-width: 0;
  -webkit-appearance: none;
}

.chat-input-area input::placeholder {
  color: var(--text-dim);
  opacity: 0.6;
}

.chat-input-area .btn-group {
  display: flex;
  gap: var(--spacing-xs);
  flex-shrink: 0;
}

.chat-input-area .btn-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--border-radius-md);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  font-size: 17px;
  flex-shrink: 0;
  touch-action: manipulation;
}

.chat-input-area .btn-icon:active { transform: scale(0.92); }
.chat-input-area .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-input-area .send-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #0A1128;
}

.chat-input-area .mic-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(212, 175, 55, 0.2);
  color: var(--text-dim);
}

.chat-input-area .mic-btn:hover {
  border-color: rgba(212, 175, 55, 0.4);
  color: var(--text-light);
}

.chat-input-area .mic-btn.listening {
  background: rgba(239, 68, 68, 0.2);
  border-color: var(--danger);
  color: var(--danger);
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ============================================================
   TOAST - notification
   ============================================================ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  max-width: 420px;
  width: 90%;
  padding: 16px 20px;
  border-radius: var(--border-radius-md);
  font-size: 14px;
  font-weight: 500;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  z-index: 999;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.toast.success {
  background: #0D2A1F;
  border: 1px solid var(--success);
  color: var(--success);
}

.toast.error {
  background: #2A0D0D;
  border: 1px solid #EF4444;
  color: #EF4444;
}

.toast.info {
  background: #1A1A2E;
  border: 1px solid var(--primary);
  color: var(--primary-light);
}

/* ============================================================
   SWIPE AREA
   ============================================================ */
.swipe-area {
  position: fixed;
  top: 0;
  left: 0;
  width: 30px;
  height: 100%;
  z-index: 50;
  cursor: pointer;
}

/* ============================================================
   RESPONSIVE - Mobile First
   ============================================================ */

/* Petits téléphones (≤ 480px) */
@media (max-width: 480px) {
  :root {
    --header-height: 56px;
    --sidebar-width: 280px;
    --spacing-lg: 12px;
    --spacing-xl: 16px;
    --spacing-xxl: 18px;
  }

  .ia-header .header-center { font-size: 17px; }
  .ia-header .header-right .user-name { font-size: 12px; max-width: 70px; }
  .ia-header .menu-toggle { width: 36px; height: 36px; font-size: 16px; min-width: 36px; }

  .message { max-width: 92%; font-size: 14px; padding: 12px 14px; }
  .suggestion-btn { font-size: 11px; padding: 6px 12px; min-height: 32px; }

  .chat-input-area { padding: 6px 10px; }
  .chat-input-area input { font-size: 14px; padding: 8px 4px; }
  .chat-input-area .btn-icon { width: 40px; height: 40px; font-size: 15px; }

  .chat-container { padding-top: calc(var(--header-height) + var(--spacing-sm)); }
  .chat-messages { padding: var(--spacing-md) var(--spacing-xs) var(--spacing-lg); gap: var(--spacing-sm); }

  .sidebar { padding: var(--spacing-sm) var(--spacing-sm); }
  .sidebar .chat-item { padding: 10px 10px; font-size: 13px; min-height: 40px; }
  .sidebar .new-chat-btn { padding: 12px 14px; font-size: 14px; min-height: 44px; }
}

/* Téléphones moyens et grands (481px - 768px) */
@media (min-width: 481px) and (max-width: 768px) {
  :root {
    --header-height: 58px;
    --spacing-lg: 14px;
  }

  .ia-header .header-center { font-size: 18px; }
  .message { max-width: 85%; }
  .chat-container { padding-top: calc(var(--header-height) + var(--spacing-sm)); }
}

/* Tablettes (769px - 1024px) */
@media (min-width: 769px) and (max-width: 1024px) {
  :root {
    --header-height: 64px;
    --max-content-width: 900px;
    --spacing-lg: 18px;
    --spacing-xxl: 28px;
  }

  .ia-header .header-center { font-size: 22px; }
  .message { max-width: 75%; font-size: 16px; padding: 16px 20px; }
  .chat-input-area { padding: 10px 16px; }
  .chat-input-area input { font-size: 16px; }

  .sidebar { width: 320px; }
  .sidebar .chat-item { font-size: 15px; padding: 14px 16px; }
  .sidebar .new-chat-btn { font-size: 16px; padding: 16px 18px; }

<body>

<!-- ============================================================
     BACKGROUND
     ============================================================ -->
<div class="gradient-bg"></div>
<div class="orb orb-1"></div>

<div class="main-content" role="main">

  <div class="chat-container">

<!-- IMPORTS -->
<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut 
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    doc, 
    getDoc, 
    setDoc, 
    updateDoc, 
    deleteDoc, 
    query, 
    where, 
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEjj2oAg7ZL8HvdkSWliShxydgq_BPxzs",
    authDomain: "brickshare-d35b3.firebaseapp.com",
    projectId: "brickshare-d35b3",
    storageBucket: "brickshare-d35b3.firebasestorage.app",
    messagingSenderId: "613227362818",
    appId: "1:613227362818:web:c4de1ad3372c16d8d3051b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ============================================================
  // PERSISTANCE
  // ============================================================
  setPersistence(auth, browserLocalPersistence);

  // ============================================================
  // DOM
  // ============================================================
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const menuToggle = document.getElementById('menuToggle');
  const swipeArea = document.getElementById('swipeArea');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const typingIndicator = document.getElementById('typingIndicator');
  const chatList = document.getElementById('chatList');
  const newChatBtn = document.getElementById('newChatBtn');
  const searchToggleBtn = document.getElementById('searchToggleBtn');
  const searchArea = document.getElementById('searchArea');
  const searchInput = document.getElementById('searchInput');
  const toast = document.getElementById('toast');
  const headerUserName = document.getElementById('headerUserName');

  let currentUser = null;
  let currentChatId = null;
  let allChats = [];
  let touchStartX = 0;
  let isMobile = window.innerWidth < 768;
  let knowledgeBase = {};
  let toastTimeout = null;
  let recognition = null;
  let isListening = false;
  let authTimeout = null;
  let scrollTimeout = null;

  // ============================================================
  // RECONNAISSANCE VOCALE
  // ============================================================
  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      if (micBtn) micBtn.style.display = 'none';
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      if (micBtn) {
        micBtn.classList.add('listening');
        micBtn.innerHTML = '<i class="fas fa-circle" style="color: #EF4444;" aria-hidden="true"></i>';
      }
    };

    recognition.onerror = (event) => {
      console.error('Erreur reconnaissance:', event.error);
      stopListening();
      showToast('❌ Erreur microphone. Réessayez.', 'error');
    };

    recognition.onend = () => {
      stopListening();
    };

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      if (chatInput) chatInput.value = transcript.trim();
    };
  }

  function startListening() {
    if (!recognition) {
      showToast('❌ La reconnaissance vocale n\'est pas supportée par votre navigateur.', 'error');
      return;
    }

    if (isListening) {
      stopListening();
      return;
    }

    try {
      recognition.start();
    } catch (error) {
      console.error('Erreur démarrage:', error);
    }
  }

  function stopListening() {
    isListening = false;
    if (micBtn) {
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '<i class="fas fa-microphone" aria-hidden="true"></i>';
    }
    try {
      if (recognition) recognition.stop();
    } catch (error) {
      // Ignorer
    }
  }

  if (micBtn) {
    micBtn.addEventListener('click', startListening);
    micBtn.addEventListener('touchstart', (e) => {
      // Empêcher le double déclenchement sur mobile
      e.preventDefault();
      startListening();
    });
  }

  // ============================================================
  // CHARGER LA BASE DE CONNAISSANCES
  // ============================================================
  function loadKnowledge() {
    const knowledgeRef = collection(db, 'ia_knowledge');
    onSnapshot(knowledgeRef, (snapshot) => {
      knowledgeBase = {};
      snapshot.forEach(doc => {
        const data = doc.data();
        knowledgeBase[data.key] = data.response;
      });
      console.log('✅ Base de connaissances chargée:', Object.keys(knowledgeBase).length, 'entrées');
    }, (error) => {
      console.error('❌ Erreur chargement connaissances:', error);
    });
  }

  // ============================================================
  // RECHERCHER RÉPONSE
  // ============================================================
  function getResponse(text) {
    const lower = text.toLowerCase().trim();
    
    // Recherche exacte ou partielle
    for (const [key, value] of Object.entries(knowledgeBase)) {
      if (lower.includes(key) || key.includes(lower) || lower.includes(key.substring(0, 10))) {
        return value;
      }
    }
    
    return "🤔 Je n'ai pas encore de réponse pour cela. Je suis en phase d'apprentissage. Tu peux poser une autre question ou utiliser les suggestions ci-dessous.";
  }

  // ============================================================
  // GESTION DES DISCUSSIONS
  // ============================================================
  function getChatsCache() {
    try {
      return JSON.parse(localStorage.getItem(`nif_chats_${currentUser?.uid}`) || '[]');
    } catch {
      return [];
    }
  }

  function saveChatsCache(chats) {
    try {
      localStorage.setItem(`nif_chats_${currentUser?.uid}`, JSON.stringify(chats));
    } catch (e) {
      console.warn('Impossible de sauvegarder en cache:', e);
    }
  }

  function listenChats() {
    if (!currentUser) return;

    const chatsRef = collection(db, 'ia_chats');
    const q = query(chatsRef, where('userId', '==', currentUser.uid));

    onSnapshot(q, (snapshot) => {
      const chats = [];
      snapshot.forEach(doc => {
        chats.push({ id: doc.id, ...doc.data() });
      });
      chats.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      allChats = chats;
      saveChatsCache(chats);
      renderChatList();
    }, (error) => {
      console.error('❌ Erreur écoute discussions:', error);
      const cached = getChatsCache();
      if (cached.length > 0) {
        allChats = cached;
        renderChatList();
      }
    });
  }

  function renderChatList() {
    if (!chatList) return;

    if (allChats.length === 0) {
      chatList.innerHTML = `
        <div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
          <i class="fas fa-comment" style="display:block; margin-bottom:8px; font-size:20px;" aria-hidden="true"></i>
          Aucune discussion
        </div>
      `;
      return;
    }

    let html = '';
    allChats.forEach(chat => {
      const isActive = chat.id === currentChatId ? 'active' : '';
      const name = chat.name || 'Nouvelle discussion';
      html += `
        <div class="chat-item ${isActive}" data-chatid="${chat.id}" role="listitem">
          <i class="fas fa-comment" aria-hidden="true"></i>
          <span class="chat-name">${escapeHtml(name)}</span>
          <span class="chat-delete" data-chatid="${chat.id}" aria-label="Supprimer la discussion"><i class="fas fa-times" aria-hidden="true"></i></span>
        </div>
      `;
    });
    chatList.innerHTML = html;

    // Événements click
    chatList.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.chat-delete')) return;
        const chatId = item.dataset.chatid;
        if (chatId) loadChat(chatId);
        closeMenu();
      });
      // Support tactile
      item.addEventListener('touchstart', () => {
        // Petit délai pour éviter le conflit avec le swipe
      });
    });

    chatList.querySelectorAll('.chat-delete').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const chatId = btn.dataset.chatid;
        if (chatId && confirm('Supprimer cette discussion ?')) {
          try {
            await deleteDoc(doc(db, 'ia_chats', chatId));
            showToast('Discussion supprimée', 'info');
            if (currentChatId === chatId) {
              currentChatId = null;
              if (chatMessages) {
                chatMessages.innerHTML = `
                  <div class="message ia">
                    👋 Bonjour ! Je suis <strong class="msg-strong">NIF AI</strong>.<br><br>
                    Comment puis-je t'aider aujourd'hui ?
                    <span class="msg-time">Maintenant</span>
                  </div>
                `;
              }
            }
          } catch (error) {
            console.error('Erreur suppression:', error);
            showToast('Erreur lors de la suppression', 'error');
          }
        }
      });
    });
  }

  // Échapper le HTML pour éviter les injections
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function createNewChat() {
    if (!currentUser) {
      showToast('Veuillez vous connecter', 'error');
      return;
    }

    try {
      const chatId = 'chat_' + Date.now();
      const newChat = {
        userId: currentUser.uid,
        chatId: chatId,
        name: 'Nouvelle discussion',
        messages: [{
          sender: 'ia',
          text: '👋 Bonjour ! Je suis **NIF AI**, l\'assistant intelligent de NIF.\n\nComment puis-je t\'aider aujourd\'hui ?',
          time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
        }],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      await setDoc(doc(db, 'ia_chats', chatId), newChat);
      currentChatId = chatId;
      loadChat(chatId);
      closeMenu();
      showToast('Nouvelle discussion créée', 'info');
    } catch (error) {
      console.error('Erreur création:', error);
      showToast('Erreur lors de la création', 'error');
    }
  }

  async function loadChat(chatId) {
    try {
      const chatRef = doc(db, 'ia_chats', chatId);
      const chatSnap = await getDoc(chatRef);
      if (chatSnap.exists()) {
        const chat = chatSnap.data();
        currentChatId = chatId;
        if (chatMessages) {
          chatMessages.innerHTML = '';
          chat.messages.forEach(msg => {
            addMessage(msg.text, msg.sender, msg.time);
          });
        }
        renderChatList();
      }
    } catch (error) {
      console.error('Erreur chargement:', error);
    }
  }

  // ============================================================
  // AJOUTER UN MESSAGE
  // ============================================================
  function addMessage(text, sender, time) {
    if (!chatMessages) return;
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const formattedText = text
      .replace(/\n/g, '<br>')
      .replace(/\*\*(.*?)\*\*/g, '<strong class="msg-strong">$1</strong>');
    div.innerHTML = `${formattedText}<span class="msg-time">${time || 'Maintenant'}</span>`;
    chatMessages.appendChild(div);
    
    // Scroll en douceur
    requestAnimationFrame(() => {
      if (chatMessages) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });
  }

  // ============================================================
  // ENVOYER UN MESSAGE
  // ============================================================
  async function sendMessage() {
    if (!chatInput) return;
    const text = chatInput.value.trim();
    if (!text || !currentUser) return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    // Créer une nouvelle discussion si nécessaire
    if (!currentChatId) {
      const chatId = 'chat_' + Date.now();
      const newChat = {
        userId: currentUser.uid,
        chatId: chatId,
        name: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
        messages: [],
        createdAt: now.toISOString(),
        updatedAt: now.toISOString()
      };
      try {
        await setDoc(doc(db, 'ia_chats', chatId), newChat);
        currentChatId = chatId;
      } catch (error) {
        console.error('Erreur création discussion:', error);
        showToast('Erreur lors de la création', 'error');
        return;
      }
    }

    // Ajouter le message utilisateur
    addMessage(text, 'user', timeStr);
    chatInput.value = '';
    if (sendBtn) sendBtn.disabled = true;

    // Sauvegarder dans Firestore
    try {
      const chatRef = doc(db, 'ia_chats', currentChatId);
      const chatSnap = await getDoc(chatRef);
      if (chatSnap.exists()) {
        const chat = chatSnap.data();
        const messages = [...(chat.messages || []), { sender: 'user', text, time: timeStr }];
        const name = messages.length === 1 ? text.substring(0, 30) + (text.length > 30 ? '...' : '') : chat.name;
        await updateDoc(chatRef, { messages, name, updatedAt: new Date().toISOString() });
      }
    } catch (error) {
      console.error('Erreur sauvegarde message:', error);
    }

    // Afficher l'indicateur de frappe
    if (typingIndicator) typingIndicator.classList.add('show');
    if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;

    // Simuler le temps de réponse
    const delay = 800 + Math.random() * 400;
    setTimeout(async () => {
      if (typingIndicator) typingIndicator.classList.remove('show');
      
      const response = getResponse(text);
      const responseTime = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      addMessage(response, 'ia', responseTime);

      // Sauvegarder la réponse
      try {
        const chatRef2 = doc(db, 'ia_chats', currentChatId);
        const chatSnap2 = await getDoc(chatRef2);
        if (chatSnap2.exists()) {
          const chat = chatSnap2.data();
          const messages = [...(chat.messages || []), { sender: 'ia', text: response, time: responseTime }];
          await updateDoc(chatRef2, { messages, updatedAt: new Date().toISOString() });
        }
      } catch (error) {
        console.error('Erreur sauvegarde réponse:', error);
      }

      if (sendBtn) sendBtn.disabled = false;
      if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
      renderChatList();
    }, delay);
  }

  // ============================================================
  // GESTION DU MENU
  // ============================================================
  function openMenu() {
    if (sidebar) sidebar.classList.add('open');
    if (sidebarOverlay) sidebarOverlay.classList.add('show');
    if (menuToggle) menuToggle.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    if (sidebar) sidebar.classList.remove('open');
    if (sidebarOverlay) sidebarOverlay.classList.remove('show');
    if (menuToggle) menuToggle.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  if (menuToggle) {
    menuToggle.addEventListener('click', openMenu);
    menuToggle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (sidebar?.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
  }

  if (sidebarOverlay) {
    sidebarOverlay.addEventListener('click', closeMenu);
    sidebarOverlay.addEventListener('touchstart', closeMenu);
  }

  // Swipe pour ouvrir le menu
  if (isMobile) {
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchEndX - touchStartX > 50 && touchStartX < 30) {
        openMenu();
      }
    }, { passive: true });
  }

  // ============================================================
  // RECHERCHE
  // ============================================================
  if (searchToggleBtn) {
    searchToggleBtn.addEventListener('click', () => {
      if (searchArea) {
        searchArea.classList.toggle('show');
        if (searchArea.classList.contains('show') && searchInput) {
          setTimeout(() => searchInput.focus(), 100);
        }
      }
    });
  }

  if (searchInput) {
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      if (chatList) {
        chatList.querySelectorAll('.chat-item').forEach(item => {
          const name = item.querySelector('.chat-name')?.textContent?.toLowerCase() || '';
          item.style.display = name.includes(query) ? 'flex' : 'none';
        });
      }
    });
  }

  // ============================================================
  // SUGGESTIONS
  // ============================================================
  document.querySelectorAll('.suggestion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const question = btn.dataset.question;
      if (question && chatInput) {
        chatInput.value = question;
        sendMessage();
      }
    });
    btn.addEventListener('touchstart', (e) => {
      // Éviter le double déclenchement
      e.preventDefault();
      const question = btn.dataset.question;
      if (question && chatInput) {
        chatInput.value = question;
        sendMessage();
      }
    });
  });
  
    // ============================================================
  // TOAST
  // ============================================================
  function showToast(message, type = 'info') {
    if (!toast) return;
    if (toastTimeout) {
      clearTimeout(toastTimeout);
      toastTimeout = null;
    }
    
    toast.classList.remove('show');
    void toast.offsetWidth;
    
    toast.textContent = message;
    toast.className = `toast ${type}`;
    
    toast.classList.add('show');
    
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
      toastTimeout = null;
    }, 3000);
  }

  // ============================================================
  // HEADER - Mettre à jour le nom
  // ============================================================
  function updateHeader(userData) {
    if (!headerUserName || !userData) return;
    const displayName = userData.prenom || userData.fullName || userData.nom || 'Invité';
    headerUserName.textContent = displayName;
  }

  // ============================================================
  // AUTH
  // ============================================================
  onAuthStateChanged(auth, async (user) => {
    clearTimeout(authTimeout);

    if (user) {
      currentUser = user;
      localStorage.setItem('NIF_current_user', user.uid);
      
      try {
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
          updateHeader(userSnap.data());
        }
      } catch (error) {
        console.error('Erreur récupération utilisateur:', error);
      }
      
      loadKnowledge();
      listenChats();
      
      const cached = getChatsCache();
      if (cached.length > 0) {
        loadChat(cached[0].id);
      }
      
    } else {
      const savedUid = localStorage.getItem('NIF_current_user');
      
      if (savedUid) {
        authTimeout = setTimeout(() => {
          if (!auth.currentUser) {
            localStorage.removeItem('NIF_current_user');
            window.location.href = 'login.html';
          }
        }, 6000);
      } else {
        window.location.href = 'login.html';
      }
    }
  });

  // ============================================================
  // ÉVÉNEMENTS
  // ============================================================
  if (chatInput) {
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }

  if (sendBtn) {
    sendBtn.addEventListener('click', sendMessage);
    sendBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      sendMessage();
    });
  }

  if (newChatBtn) {
    newChatBtn.addEventListener('click', createNewChat);
    newChatBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      createNewChat();
    });
  }

  // ============================================================
  // GESTION DES CHANGEMENTS DE TAILLE
  // ============================================================
  let resizeTimeout = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      isMobile = window.innerWidth < 768;
      if (chatMessages) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }, 200);
  });

  // ============================================================
  // INITIALISATION
  // ============================================================
  initSpeechRecognition();

  console.log('🚀 NIF IA chargée - Version multi-appareils');
  console.log('📱 Adapté pour téléphone, tablette et ordinateur');
  console.log('🎙️ Note vocale disponible');
</script>

</body>
</html>
